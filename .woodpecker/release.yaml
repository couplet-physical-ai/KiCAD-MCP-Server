# Roadrunner release (Woodpecker + Dagger, https://cicd.apps.example.com): a pushed v* tag
# publishes the GitHub release; the port of .github/workflows/release.yml (process:
# docs/RELEASING.md). .woodpecker/release.sh on the host checks the tag (= package.json version,
# commit on main), writes the notes with scripts/release-notes.mjs, runs `gh release create`
# (an existing release is left alone) and, for non-prerelease tags, pushes the commit to stable.
# As exowatt-woodpecker-bot: repo secret github_release_token (tag events only).
# `$$` escapes `$` for Woodpecker. Docs: https://cicd.docs.example.com/roadrunner/
labels:
  tier: "0"
when:
  - event: tag
    ref: refs/tags/v*
steps:
  - name: publish
    image: bash
    environment:
      GH_TOKEN:
        from_secret: github_release_token
    commands:
      - bash .woodpecker/release.sh "$$CI_COMMIT_TAG"
